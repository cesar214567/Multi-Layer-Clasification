      - name: Training
        meta:
          id: fld_bf22ffbcff0f4370ba632145afa2d847
          created: 1773780400000
          modified: 1773780400000
          sortKey: -1772736043116.5
          description: "Train a model using images from a project. Supports three
            architecture modes: Keras with top, Keras without top + custom
            layers, and fully custom architecture. Uses hybrid tf.data pipeline
            that streams from S3 and caches to disk."
        children:
          - url: "{{base_url}}/api/trained-models/train/"
            name: Train - Keras with top
            meta:
              id: req_143d7fbdf8304cee960bbdcedf52b2fc
              created: 1773780400000
              modified: 1774890495888
              isPrivate: false
              description: "Train a model that uses a known Keras architecture with
                include_top=true. The original last classification layer is
                replaced with a Dense layer matching num_classes. If num_classes
                is not provided, it defaults to the number of unique tag labels
                found in the project images. Requires: a TrainedModel created
                with a Keras architecture and include_top=true, and a Project
                with tagged images uploaded to S3. Hyper-parameters (epochs,
                batch_size, img_size, learning_rate) are read from the
                TrainedModel."
              sortKey: -1773780400006
            method: POST
            body:
              mimeType: text/plain
              text: |-
                {
                  "trained_model_id": "69caadfae49b115ef1d5f1e2",
                  "project_id": "69b450d70ae216e44b802ff2",
                  "version_notes": "Version 1"
                }
            headers:
              - name: Content-Type
                value: application/json
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{base_url}}/api/trained-models/train/"
            name: Train - Keras without top + custom layers
            meta:
              id: req_73aa55bfdec3439a88f7cdff6c9278c0
              created: 1773780400000
              modified: 1774890431416
              isPrivate: false
              description: "Train a model that uses a known Keras architecture with
                include_top=false and custom replacement top layers. The base
                model is frozen as a feature extractor and only the custom top
                layers are trained. Requires: a TrainedModel created with
                include_top=false and custom_top_layers, and a Project with
                tagged images uploaded to S3. Hyper-parameters (epochs,
                batch_size, img_size, learning_rate) are read from the
                TrainedModel."
              sortKey: -1773780400005
            method: POST
            body:
              mimeType: text/plain
              text: |-
                {
                  "trained_model_id": "69caadbae49b115ef1d5f1e1",
                  "project_id": "69b450d70ae216e44b802ff2",
                  "version_notes": "Training with frozen base + custom head"
                }
            headers:
              - name: Content-Type
                value: application/json
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{base_url}}/api/trained-models/train/"
            name: Train - Fully custom architecture
            meta:
              id: req_8a2f228aac1b413fac7c20b622122dce
              created: 1773780400000
              modified: 1774890317356
              isPrivate: false
              description: 'Train a model with a fully custom architecture
                (architecture="custom"). The entire model is built from the
                custom_architecture layer definitions and trained from scratch.
                Requires: a TrainedModel created with architecture="custom" and
                custom_architecture defined, and a Project with tagged images
                uploaded to S3. Hyper-parameters (epochs, batch_size, img_size,
                learning_rate) are read from the TrainedModel.'
              sortKey: -1773780400004
            method: POST
