                replacement top layers.
              sortKey: -1772736043113.5
            method: POST
            body:
              mimeType: text/plain
              text: >-
                {
                  "name": "MobileNetV2 Custom Head",
                  "description": "MobileNetV2 feature extractor with custom classification head",
                  "architecture": "MobileNetV2",
                  "include_top": false,
                  "epochs": 10,
                  "batch_size": 32,
                  "img_size": 224,
                  "learning_rate": 0.0001,
                  "loss": "sparse_categorical_crossentropy",
                  "metrics": ["accuracy"],
                  "custom_top_layers": [
                    {"type": "GlobalAveragePooling2D"},
                    {"type": "Dense", "units": 256, "activation": "relu"},
                    {"type": "Dropout", "rate": 0.5}
                  ],
                	"project_id": "69b450d70ae216e44b802ff2",
                  "tag_ids": [
                    "69b98c73449f72685516cef9",
                    "69b98c73449f72685516cefa"
                  ]
                }
            headers:
              - name: Content-Type
