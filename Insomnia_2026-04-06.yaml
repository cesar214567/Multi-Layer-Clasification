          - url: "{{base_url}}/api/trained-models/"
            name: Create Trained Model - Fully custom architecture
            meta:
              id: req_be1feb1eae7743f28f6a57259a389022
              created: 1773780400000
              modified: 1774545796443
              isPrivate: false
              description: Create a trained model with a fully custom architecture defined
                layer by layer. Set architecture to "custom" and provide the
                complete layer list in custom_architecture.
              sortKey: -1772736043113.3
            method: POST
            body:
              mimeType: text/plain
              text: >-
                {
                  "name": "Custom CNN",
                  "description": "Fully custom CNN architecture",
                  "architecture": "custom",
                  "epochs": 20,
                  "batch_size": 32,
                  "img_size": 224,
                  "learning_rate": 0.001,
                  "loss": "sparse_categorical_crossentropy",
                  "metrics": ["accuracy"],
                  "custom_architecture": [
                    {"type": "InputLayer", "input_shape": [224, 224, 3]},
                    {"type": "Conv2D", "filters": 32, "kernel_size": 3, "activation": "relu"},
                    {"type": "MaxPooling2D", "pool_size": 2},
                    {"type": "Conv2D", "filters": 64, "kernel_size": 3, "activation": "relu"},
                    {"type": "MaxPooling2D", "pool_size": 2},
                    {"type": "Flatten"},
                    {"type": "Dense", "units": 128, "activation": "relu"},
                    {"type": "Dropout", "rate": 0.5}
                  ],
                	"project_id": "69b450d70ae216e44b802ff2",
                  "tag_ids": [
                    "69b98c73449f72685516cef9",
                    "69b98c73449f72685516cefa"
                  ]
                }
            headers:
              - name: Content-Type
                value: application/json
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
