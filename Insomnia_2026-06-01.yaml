      - name: PreTrained Models CRUD
        meta:
          id: fld_2dea520d2b4c46eab5e21168c79900d3
          created: 1772736061058
          modified: 1772736061058
          sortKey: -1772736043111
          description: CRUD for pretrained Keras models. POST builds the model from
            architecture+dataset, saves as .h5, and uploads to S3 automatically.
        children:
          - url: "{{base_url}}/api/pretrained-models/"
            name: Build and Upload PreTrained Model
            meta:
              id: req_248e4a73a8694542b113e5726f358284
              created: 1772736061058
              modified: 1773946058823
              isPrivate: false
              description: "Build a Keras pretrained model from architecture+dataset, save as
                .h5, upload to S3 (LocalStack), and persist metadata in MongoDB.
                Supported architectures: VGG16, VGG19, MobileNet, MobileNetV2,
                ResNet50, ResNet101, InceptionV3, EfficientNetB0-B7,
                DenseNet121, etc. Use dataset=imagenet to load pretrained
                weights; any other value uses random weights."
              sortKey: -1772736043108
            method: POST
            body:
              mimeType: text/plain
              text: |-
                {
                  "architecture": "EfficientNetB0",
                  "dataset": "imagenet",
                  "description": "EfficientNetB0 with ImageNet weights",
                  "project_id": "69b450d70ae216e44b802ff2"
                }
            headers:
              - name: Content-Type
                value: application/json
            settings:
              renderRequestBody: true
              encodeUrl: true
